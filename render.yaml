# Render Blueprint for the backend (NestJS + Prisma + PostgreSQL).
# Render detects it at the repo root. It creates the database and the web
# service with their variables already wired. Import via: Render → New →
# Blueprint.
#
# This blueprint is the CORRECT service config: it compiles during the build and
# starts with `node dist/main` (the already compiled JS). It does NOT use
# `yarn start` or `nest start`, which would recompile TypeScript on every start
# and exhaust the free plan's memory (~256 MB of heap), causing OOM on deploy.

databases:
  - name: tu-chamba-db
    databaseName: tu_chamba
    plan: free

services:
  - type: web
    name: tu-chamba-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # Branch Render deploys. Production lives on main (develop is merged into
    # main). Change it if your production service tracks another branch.
    branch: main
    # Migrations run in the build: on Render's free plan, preDeployCommand does
    # NOT run. migrate deploy is idempotent, so running it on every build is
    # safe and guarantees the tables exist.
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      # Database connection: Render injects it from the DB above.
      - key: DATABASE_URL
        fromDatabase:
          name: tu-chamba-db
          property: connectionString
      # JWT secret: Render generates a secure random value.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Frontend domains (web; the panel lives at /admin in the same app).
      # Filled in by hand in the dashboard.
      - key: CORS_ORIGINS
        sync: false
      # Google Indexing API (service account with Search Console access).
      # Filled in by hand in the dashboard; without them the integration is a
      # no-op.
      - key: GOOGLE_INDEXING_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_INDEXING_PRIVATE_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
      # Explicit heap cap for the build: `nest build` (tsc) needs ~350 MB
      # because of Prisma's generated types, but on a 512 MB machine Node
      # auto-limits the heap to ~256 MB → OOM. This ceiling prevents that.
      # It's only a ceiling (it reserves no memory); harmless at runtime.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
